<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 우리들의 교환독서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Gowun Dodum', sans-serif;
    background: #f7f1e6;
    color: #3b2f25;
    min-height: 100vh;
    background-image: radial-gradient(#e8dcc6 1px, transparent 1px);
    background-size: 22px 22px;
  }
  header { text-align: center; padding: 56px 20px 24px; }
  header .tag {
    display: inline-block; font-size: 14px; letter-spacing: 2px;
    background: #3b2f25; color: #f7f1e6; padding: 6px 14px; border-radius: 999px;
  }
  header h1 { font-family: 'Gowun Batang', serif; font-size: clamp(30px, 6vw, 48px); margin: 18px 0 10px; }
  header p { color: #7a6654; font-size: 17px; }

  .members { max-width: 860px; margin: 6px auto 30px; padding: 0 20px; text-align: center; }
  .members h3 { font-family: 'Gowun Batang', serif; font-size: 18px; color: #7a6654; margin-bottom: 14px; letter-spacing: 1px; }
  .members .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .members .br { flex-basis: 100%; height: 0; }
  @media (max-width: 560px) { .members .br { display: none; } }
  .members .m { background: #fffaf2; border: 1.5px solid #c9b49a; border-radius: 999px; padding: 8px 18px; font-size: 17px; }
  .members .m.away { border-style: dashed; background: #fdeee8; border-color: #e0a58f; }
  .members .m small { font-size: 13px; color: #b0533c; margin-left: 4px; }
  .gallery {
    max-width: 1100px; margin: 20px auto 0; padding: 0 20px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 26px;
  }
  .polaroid {
    background: #fff; padding: 12px 12px 16px; border-radius: 4px;
    box-shadow: 0 6px 18px rgba(59,47,37,.15);
    transition: transform .25s;
  }
  .polaroid:nth-child(odd) { transform: rotate(-1.6deg); }
  .polaroid:nth-child(even) { transform: rotate(1.4deg); }
  .polaroid:hover { transform: rotate(0) scale(1.04); z-index: 2; }
  .polaroid .img {
    width: 100%; aspect-ratio: 3 / 4; background: #eee5d5; border-radius: 2px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    font-size: 54px;
  }
  .polaroid img, .polaroid video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .polaroid .date {
    text-align: center; margin-top: 12px; font-size: 13px; letter-spacing: 1px; color: #b0533c; font-weight: bold;
  }
  .polaroid .cap { font-family: 'Gowun Batang', serif; text-align: center; margin-top: 4px; font-size: 16px; }

  .leave-box {
    max-width: 640px; margin: 70px auto 0; padding: 40px 24px; text-align: center;
    background: #fffaf2; border: 2px dashed #c9b49a; border-radius: 18px;
  }
  .leave-box h2 { font-family: 'Gowun Batang', serif; font-size: 26px; margin-bottom: 10px; }
  .leave-box p { color: #7a6654; margin-bottom: 30px; }
  .btn-slot { height: 60px; display: flex; align-items: center; justify-content: center; }
  #leaveBtn {
    font-family: inherit; font-size: 18px; font-weight: bold;
    background: #c0392b; color: #fff; border: none; border-radius: 12px;
    padding: 14px 34px; cursor: pointer; box-shadow: 0 4px 0 #8e2a20;
    transition: left .18s ease-out, top .18s ease-out, transform .15s;
    z-index: 1000; white-space: nowrap;
  }
  #leaveBtn.running { position: fixed; }
  #leaveBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8e2a20; }
  .counter {
    display: inline-flex; align-items: center; gap: 14px; margin-bottom: 26px;
    background: #3b2f25; color: #f7f1e6; padding: 10px 26px; border-radius: 999px;
    z-index: 999; transition: background .3s;
  }
  .counter .label { font-size: 18px; }
  .counter .num { font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 52px; line-height: 1; color: #ffd166; display: inline-block; }
  .counter.floating {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    box-shadow: 0 8px 24px rgba(59,47,37,.35);
  }
  .counter.done { background: #2e7d32; }
  .num.pop { animation: pop .4s ease-out; }
  @keyframes pop { 0% { transform: scale(1.9); color: #ff6b6b; } 100% { transform: scale(1); } }
  #leaveBtn.back { animation: comeBack .6s ease-out; }
  @keyframes comeBack { 0% { transform: scale(.3); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
  #leaveBtn.tired { background: #7a6654; box-shadow: 0 4px 0 #4f4135; }
  #taunt { margin-top: 26px; min-height: 26px; font-size: 17px; color: #c0392b; font-weight: bold; }
  footer { margin-top: 90px; text-align: center; color: #a8937e; font-size: 13px; padding-bottom: 30px; }
</style>
</head>
<body>

<header>
  <span class="tag">EXCHANGE READING CLUB</span>
  <h1>📚 우리들의 교환독서</h1>
  <p>한 권의 책이 한 바퀴 돌 때마다, 우리는 조금씩 가까워졌습니다.</p>
</header>

<section class="members">
  <h3>함께 읽는 사람들</h3>
  <div class="chips"><span class="m">강범현</span><span class="m away">김경주</span><span class="m">김수경</span><span class="m">김연경</span><span class="m">이철희</span><span class="br"></span><span class="m">임유원</span><span class="m">장인형</span><span class="m">정혜원</span><span class="m">황정은</span></div>
</section>

<section class="gallery" id="gallery"></section>

<section class="leave-box">
  <h2>탈퇴를 원하시나요?</h2>
  <p>아래 버튼을 눌러주세요.</p>
  <div class="counter" id="counter"><span class="label">남은 도망 횟수</span><span class="num" id="countNum">5</span></div>
  <div class="btn-slot" id="slot"><button id="leaveBtn">탈퇴하기</button></div>
  <div id="taunt"></div>
</section>

<section id="guestbook" data-title="📝 교환독서 방명록" data-sub="책 이야기, 고마운 마음, 내년 다짐… 한마디 남겨주세요!" data-page="메인"></section>

<footer>© 교환독서 모임 · 한 번 들어오면 나갈 수 없는 곳</footer>

<script>
/* ===== 사진 설정 =====
   photos 폴더에 사진을 넣고, 아래 목록에 파일 이름과 설명을 적어주세요. */
const PHOTOS = [
  { src: 'photos/p1.jpg', date: '2026. 6. 2 (화)', cap: '1회차 · 책들이 처음 모인 날' },
  { src: 'photos/v1.mp4', poster: 'photos/v1.jpg', date: '2026. 6. 2 (화)', cap: '🎬 책, 바꿔 들기!' },
  { src: 'photos/p2.jpg', date: '2026. 7. 16 (목)', cap: '2회차 · 손에서 손으로' },
  { src: 'photos/v2.mp4', poster: 'photos/v2.jpg', date: '2026. 7. 16 (목)', cap: '🎬 한 바퀴 돌았습니다' },
  { src: 'photos/p3.jpg', date: '2026. 9. 23 (수)', cap: '3회차 · 새 책이 들어왔어요' },
  { src: 'photos/v3.mp4', poster: 'photos/v3.jpg', date: '2026. 9. 23 (수)', cap: '🎬 오늘은 누구 차례?' },
  { src: 'photos/p4.jpg', date: '2026. 11. 4 (수)', cap: '4회차 · 앗, 아래 빵이 보이네 🥐' },
  { src: 'photos/v4.mp4', poster: 'photos/v4.jpg', date: '2026. 11. 4 (수)', cap: '🎬 그리고 또 다음 책으로' },
];

const gallery = document.getElementById('gallery');
const emojis = ['📖','📚','☕','🔖','✏️','🌿'];
PHOTOS.forEach((p, i) => {
  const card = document.createElement('div');
  card.className = 'polaroid';
  card.innerHTML = `<div class="img"></div><div class="date"></div><div class="cap"></div>`;
  card.querySelector('.cap').textContent = p.cap;
  card.querySelector('.date').textContent = p.date || '';
  const box = card.querySelector('.img');
  if (p.src.endsWith('.mp4')) {
    const v = document.createElement('video');
    Object.assign(v, { src: p.src, poster: p.poster || '', muted: true, loop: true, autoplay: true, playsInline: true });
    v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
    box.appendChild(v);
    gallery.appendChild(card);
    return;
  }
  const img = new Image();
  img.alt = p.cap;
  img.onload = () => box.appendChild(img);
  img.onerror = () => { box.textContent = emojis[i % emojis.length]; }; // 사진 없으면 이모지
  img.src = p.src;
  gallery.appendChild(card);
});

/* ===== 도망가는 탈퇴 버튼 ===== */
const MAX_ESCAPES = 5;       // 도망가는 횟수
const NEAR = 110;            // 이 거리(px) 안에 들어오면 도망
const COOLDOWN = 400;        // 한 번 도망간 뒤 쉬는 시간(ms) – 한 번에 여러 번 세지 않도록
const btn = document.getElementById('leaveBtn');
const taunt = document.getElementById('taunt');
const counter = document.getElementById('counter');
const countNum = document.getElementById('countNum');
let left = MAX_ESCAPES;
let lastEscape = 0;

const lines = [
  '어딜 가세요~? 🙈', '안 잡히지롱 😝', '책이 아직 한 바퀴 더 남았어요!',
  '조금만 더 생각해 보세요 🤔', '잡을 수 있으면 잡아보세요~', '선생님 없으면 모임이 안 돌아가요 😢',
  '헉 거의 잡힐 뻔! 💨', '다음 책 벌써 골라놨는데요?'
];

const isRunning = () => left > 0;

function bump() {
  countNum.textContent = left;
  countNum.classList.remove('pop'); void countNum.offsetWidth; countNum.classList.add('pop');
  if (left === 0) {
    counter.classList.add('done');
    counter.innerHTML = '<span class="label">도망 끝!</span><span class="num">😮‍💨</span>';
    btn.textContent = '헉헉… 지쳤어요 누르세요';
    btn.classList.add('tired');
    // 원래 자리로 돌아오기 (약간 뒤에 – 마지막 도망이 보이도록)
    setTimeout(() => {
      btn.classList.remove('running');
      btn.style.left = ''; btn.style.top = '';
      counter.classList.remove('floating');
      btn.classList.add('back');
      document.querySelector('.leave-box').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 450);
    taunt.textContent = '버튼이 지쳐서 멈췄어요. 정말 누르실 건가요…?';
  }
}

function escape(px, py) {
  if (!isRunning()) return;
  const now = Date.now();
  if (now - lastEscape < COOLDOWN) return;
  lastEscape = now;

  const r = btn.getBoundingClientRect();
  if (!btn.classList.contains('running')) {
    btn.style.left = r.left + 'px';
    btn.style.top = r.top + 'px';
    btn.classList.add('running');
    document.getElementById('slot').style.minWidth = r.width + 'px';
    counter.classList.add('floating');
  }
  const w = r.width, h = r.height, pad = 16, topPad = 120; // 위쪽 카운터 자리는 비워두기
  const maxX = window.innerWidth - w - pad, maxY = window.innerHeight - h - pad;
  let x, y, tries = 0;
  do {
    x = pad + Math.random() * (maxX - pad);
    y = topPad + Math.random() * (maxY - topPad);
    tries++;
  } while (Math.hypot(x + w / 2 - px, y + h / 2 - py) < 260 && tries < 30);
  btn.style.left = x + 'px';
  btn.style.top = y + 'px';

  left--;
  bump();
  if (left > 0) taunt.textContent = lines[Math.floor(Math.random() * lines.length)];
}

document.addEventListener('mousemove', e => {
  if (!isRunning()) return;
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const dx = Math.max(Math.abs(e.clientX - cx) - r.width / 2, 0);
  const dy = Math.max(Math.abs(e.clientY - cy) - r.height / 2, 0);
  if (Math.hypot(dx, dy) < NEAR) escape(e.clientX, e.clientY);
});

// 휴대폰(터치)용: 손가락이 닿으면 도망
btn.addEventListener('touchstart', e => {
  if (isRunning()) {
    e.preventDefault();
    const t = e.touches[0];
    escape(t.clientX, t.clientY);
  }
}, { passive: false });

btn.addEventListener('click', e => {
  if (isRunning()) { e.preventDefault(); escape(e.clientX, e.clientY); return; }
  location.href = 'withdraw.html';
});
</script>
<script src="guestbook.js?v=20261104-2"></script>
</body>
</html>
